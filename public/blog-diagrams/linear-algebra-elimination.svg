<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">消元法求解方程组的步骤</title>
  <desc id="desc">m*n矩阵A，将A消元，得到主元个数r（秩），剩下的(n-r)个自由变量赋值0/1，回代求解方程组。无法取得主元的列先不管，继续消元。</desc>
  <rect width="760" height="520" rx="12" fill="#fff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#777"/></marker></defs>
  <g fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)">
    <path d="M380 80V120"/><path d="M380 180V205H215V235"/>
    <path d="M380 180V205H565V235"/><path d="M215 295V335"/><path d="M215 395V435"/>
  </g>
  <g fill="#f5f5f5" stroke="#ccc">
    <rect x="260" y="20" width="240" height="60" rx="8"/><rect x="260" y="120" width="240" height="60" rx="8"/>
    <rect x="65" y="235" width="300" height="60" rx="8"/><rect x="410" y="235" width="310" height="60" rx="8"/>
    <rect x="45" y="335" width="340" height="60" rx="8"/><rect x="65" y="435" width="300" height="60" rx="8"/>
  </g>
  <g fill="#222" font-family="sans-serif" font-size="20" text-anchor="middle">
    <text x="380" y="58">m*n矩阵A</text><text x="380" y="158">将A消元</text>
    <text x="215" y="273">得到主元个数r (秩)</text>
    <text x="565" y="260" font-size="18"><tspan x="565">无法取得主元的列先不管，</tspan><tspan x="565" dy="23">继续消元</tspan></text>
    <text x="215" y="373">剩下的(n-r)个自由变量赋值0/1</text><text x="215" y="473">回代求解方程组</text>
  </g>
</svg>
